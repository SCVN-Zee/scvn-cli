# BETA release. A semver PRERELEASE tag `v<version>` where <version> carries a
# prerelease id (e.g. v0.6.0-beta.1) builds the macOS app with the MCP tab
# HIDDEN (same tab set as stable) and publishes it to GitHub Releases as a
# PRE-RELEASE for internal testers.
#
# Why semver prerelease and not a `b` suffix: electron-builder derives the
# GitHub release tag from package.json `version` (v${version}), NOT from the git
# tag. So the git tag MUST equal v${version}, and ${version} must be valid
# semver. `0.5.0b` is invalid semver and would misfile assets under a stray
# `v0.5.0` draft; `0.6.0-beta.1` derives the matching `v0.6.0-beta.1` tag.
#
# Env split by tag, NOT by branch push (nothing runs on push to dev/main):
#   - v<version> with a prerelease id (v*-*) → this workflow    (beta,   MCP hidden)
#   - v<version> release (no prerelease id)  → release-stable.yml (stable, MCP hidden)
#
# Signing is tiered (shared with the stable workflow): Apple Developer ID when
# its secrets are set, else the stable self-signed cert (SCVN_SELFSIGN_P12) which
# lets betas auto-update to newer betas WITHOUT an Apple account, else an ad-hoc
# fallback that opens via right-click→Open but cannot auto-update. Beta testers
# get prerelease updates automatically: electron-updater enables allowPrerelease
# for an app whose own version is a prerelease.
name: release-beta

on:
  push:
    tags:
      - "v*-*" # semver prerelease tags only, e.g. v0.6.0-beta.1

concurrency:
  group: release-beta-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  beta:
    runs-on: macos-14 # electron-builder --mac must run on macOS
    env:
      # Ship the same tab set as stable — the MCP tab is hidden here too.
      SCVN_TABS: fork,git,packages,settings
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify tag == v${version} and version is a semver prerelease
        run: |
          ver="$(node -p "require('./package.json').version")"
          expected="v${ver}"
          if [ "$expected" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Beta tag ${GITHUB_REF_NAME} must equal v<version> ($expected). electron-builder publishes to v\${version}; bump package.json to the beta version first."
            exit 1
          fi
          case "$ver" in
            *-*) : ;; # has a prerelease id (e.g. 0.6.0-beta.1) — good
            *) echo "::error::Beta requires a semver prerelease version (e.g. 0.6.0-beta.1); package.json is $ver. Use release-stable.yml for a plain release."; exit 1 ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (CLI + desktop)
        run: |
          npm run typecheck
          npm run typecheck:desktop

      # electron-builder's parallel uploaders race to create the release; make
      # one PRE-RELEASE up front so every uploader attaches to it. Idempotent.
      - name: Ensure a single pre-release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --prerelease \
              --title "$GITHUB_REF_NAME" \
              --notes "Automated beta $GITHUB_REF_NAME (macOS arm64). First run may need right-click→Open; updates apply automatically when the build is signed."
      - name: Build, sign, and publish pre-release
        id: build
        env:
          # Tier 1 — Apple Developer ID (empty string when the secret is unset).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tier 2 — stable self-signed cert (auto-update without an Apple account).
          SCVN_SELFSIGN_P12: ${{ secrets.SCVN_SELFSIGN_P12 }}
          SCVN_SELFSIGN_PASSWORD: ${{ secrets.SCVN_SELFSIGN_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Tiered signing (Developer ID -> self-signed -> ad-hoc) + `signed` output.
        run: bash .github/scripts/build-sign-publish.sh beta

      # Keep updater plumbing only when the build is signed (Developer ID or the
      # stable self-signed cert); an ad-hoc fallback can't self-update, so strip
      # its manifest/blockmaps and leave only the dmg, zip, and source archives.
      - name: Prune updater plumbing when the build is unsigned
        if: steps.build.outputs.signed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Ad-hoc build cannot self-update; removing latest-mac.yml + blockmaps."
          for asset in $(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'); do
            case "$asset" in
              *.blockmap|latest-mac.yml)
                echo "Deleting $asset"
                gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes ;;
            esac
          done
