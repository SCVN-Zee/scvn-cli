# STABLE release. A `v<version>` tag (e.g. v0.5.0) builds the macOS app with the
# MCP tab HIDDEN and publishes the dmg + zip to GitHub Releases.
#
# Signing is tiered (shared script build-sign-publish.sh), best available first:
#   1. Apple Developer ID + notarization   (CSC_LINK secret)       — no first-run
#      Gatekeeper friction; auto-updates.
#   2. Stable self-signed cert              (SCVN_SELFSIGN_P12)     — auto-updates
#      WITHOUT an Apple account; first run opens via right-click→Open.
#   3. Ad-hoc fallback                      (no secrets)            — opens via
#      right-click→Open but CANNOT auto-update.
# The electron-updater manifest (latest-mac.yml), .zip, and blockmaps are KEPT
# for tiers 1–2 (signed=true) so the app auto-updates; the ad-hoc tier prunes
# them (Squirrel.Mac would reject the update) — see the prune step below.
#
# Env split by tag, NOT by branch push (nothing runs on push to dev/main):
#   - v<version> release (no prerelease id)  → this workflow      (stable, MCP hidden)
#   - v<version> with a prerelease id (v*-*) → release-beta.yml   (beta,   MCP hidden)
# The `!v*-*` line below keeps semver prerelease tags off this workflow —
# without it, `v*` would also match `v0.6.0-beta.1` and double-fire.
#
# Optional repository secrets:
#   Tier 1 (Apple Developer ID + notarization):
#     CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Tier 2 (self-signed auto-update; generate via .github/scripts/gen-selfsign-cert.sh):
#     SCVN_SELFSIGN_P12 (base64 .p12), SCVN_SELFSIGN_PASSWORD
# GITHUB_TOKEN (auto) publishes the release; contents:write is granted below.

name: release-stable

on:
  push:
    tags:
      - "v*"
      - "!v*-*" # exclude semver prerelease tags (handled by release-beta.yml)

# Supersede in-flight runs for the same tag.
concurrency:
  group: release-stable-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14 # Apple Silicon (arm64), matches the shipped target
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json ($pkg). Bump the version to match the tag."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # electron-builder runs parallel GitHub uploaders; if the release does not
      # yet exist they race and each creates a separate draft, splitting assets
      # across duplicates. Pre-creating one draft makes every uploader attach to
      # it. Idempotent: re-runs reuse the existing release for this tag.
      - name: Ensure a single draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft \
              --title "$GITHUB_REF_NAME" \
              --notes "Automated release $GITHUB_REF_NAME."

      - name: Build, sign, and publish
        id: build
        env:
          # Hide the MCP tab in the shipped build (every tab except mcp).
          SCVN_TABS: fork,git,packages,init,settings
          # Tier 1 — Apple Developer ID (empty string when the secret is unset).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tier 2 — stable self-signed cert (auto-update without an Apple account).
          SCVN_SELFSIGN_P12: ${{ secrets.SCVN_SELFSIGN_P12 }}
          SCVN_SELFSIGN_PASSWORD: ${{ secrets.SCVN_SELFSIGN_PASSWORD }}
          # Publish the release + updater metadata to this repo.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Tiered signing (Developer ID -> self-signed -> ad-hoc) + `signed` output.
        run: bash .github/scripts/build-sign-publish.sh stable

      # Auto-update plumbing (latest-mac.yml, .zip, and the differential-download
      # blockmaps) is kept when the build is signed — Developer ID OR the stable
      # self-signed cert, both of which Squirrel.Mac accepts for updates. Only the
      # ad-hoc fallback (signed=false) cannot self-update, so strip its manifest to
      # avoid a broken "update available → install fails" prompt; keep the dmg,
      # .zip, and GitHub's auto-added source archives.
      - name: Prune updater plumbing when the build is unsigned
        if: steps.build.outputs.signed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Ad-hoc/unsigned build cannot self-update; removing latest-mac.yml + blockmaps so users are not shown a broken update prompt."
          for asset in $(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'); do
            case "$asset" in
              *.blockmap|latest-mac.yml)
                echo "Deleting $asset"
                gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes ;;
            esac
          done

      # Publish (un-draft) the release as the FINAL step — only after every asset
      # is uploaded and, for an unsigned build, the updater manifest is pruned.
      # Until now the draft was un-drafted by hand, leaving a window in which the
      # pushed tag was already discoverable to running apps' updaters while
      # latest-mac.yml 404'd: draft-release assets are not served on the public
      # releases/download/<tag>/ URL. Un-drafting here closes that window so the
      # release and its manifest become visible atomically. Runs only if the
      # build succeeded (a failed build never publishes a draft).
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
